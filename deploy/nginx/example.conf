# Example nginx reverse proxy for the uploader.
#
# Assumes the docker-compose.yml from this repository: the app listens on
# 10.89.0.42:8080 inside the "uploader" network (change UPLOADER_APP_IP in .env
# and proxy_pass below together). Replace i.example.com and the certificate
# paths with your own, e.g. from certbot / Let's Encrypt.
#
# Keep UPLOADER_TRUST_PROXY=true (the compose default) so the app reads the
# client IP from X-Forwarded-For; set the "public URL" in the admin dashboard so
# generated links use your domain.

# WebSocket/upgrade passthrough: "Connection: upgrade" must only be sent when
# the client actually asked to upgrade; setting it unconditionally breaks
# keepalive on ordinary requests. This map belongs in the http{} context --
# move it to nginx.conf if this file is included per server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name i.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name i.example.com;

    ssl_certificate     /etc/letsencrypt/live/i.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Without this nginx falls back to its 1 MB default and rejects larger
    # uploads with 413. Keep it at or above the "max upload size" set in the
    # admin dashboard. Files of 10 MiB and more are uploaded in chunks (tus) by
    # the dashboard, but direct API/ShareX uploads send the whole file at once.
    client_max_body_size 1g;

    # --- Behind Cloudflare (optional) -----------------------------------------
    # Restore the real client IP. Keep this list current:
    # https://www.cloudflare.com/ips/
    #
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ...
    # real_ip_header CF-Connecting-IP;
    #
    # To accept only requests that came through YOUR Cloudflare zone, use
    # zone-level Authenticated Origin Pulls with your own client certificate
    # (ssl_client_certificate + ssl_verify_client on). Cloudflare's global
    # origin-pull certificate is presented for every customer's zone, so it only
    # proves a request came through Cloudflare, not through yours.

    # Security headers are set by the application, which varies them per route.
    # Do NOT add them here: `add_header ... always` appends instead of
    # replacing, so an X-Frame-Options here would be sent next to the app's and
    # break the deliberate framing exception of the /p/{slug} player page
    # (twitter:player embeds).

    location / {
        proxy_pass http://10.89.0.42:8080;

        # Stream large uploads straight to the backend instead of buffering the
        # whole body to a temp file first.
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never pass through: when the public URL setting is empty,
        # the app derives share/raw links from this header.
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
