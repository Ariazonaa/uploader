name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project is deliberately small — a single Go binary plus PostgreSQL, no Redis, no cloud storage backends. Please describe the use case, not just the feature, so we can find the simplest fit.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work? UI, API or configuration sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or how other tools solve it.
