# Creates the GitHub release for a pushed version tag (v1.2.3), with notes
# generated from the commits since the previous tag. The Docker workflow builds
# and publishes the matching image (:1.2.3, :1.2, :latest) from the same tag.
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
